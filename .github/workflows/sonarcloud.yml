name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository (Crucial step missing in the original)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # 2. Setup Node.js environment (Must happen before analysis)
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 3. Cache dependencies
      - name: Cache Node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4. Analyze with SonarCloud
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Ensure this secret is added in GitHub
        with:
          # Arguments must be formatted as a string block
          args: >
            -Dsonar.projectKey=LevonGabrielyan04_dropkey
            -Dsonar.organization=levongabrielyan04
          projectBaseDir: .
